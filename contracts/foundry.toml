[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib", "../node_modules"]
allow_paths = ["../node_modules"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts/=../node_modules/@openzeppelin/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
bot_testnet = "${BOT_TESTNET_RPC}"
bot_mainnet = "${BOT_MAINNET_RPC}"
